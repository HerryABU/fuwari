<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuwari Admin</title>
<link rel="stylesheet" href="/assets/cherry/cherry-markdown.min.css">
<style>
  /* 管理后台：与前台完全一致的主题变量（由注入的 themes/<name>/theme.css 覆盖），
     亮色 :root 与暗色 :root.dark 两套；语义色带 fallback。 */
  :root { --fw-err: #ef4444; --fw-ok: #22c55e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page-bg, #f5f6f8); color: var(--deep-text, #1f2328); height: 100vh; display: flex; flex-direction: column; transition: background .3s, color .3s; }
  header { background: var(--card-bg, #1f2328); color: var(--deep-text, #fff); border-bottom: 1px solid var(--line-color, transparent); padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  header .brand { font-weight: 700; margin-right: 0.4rem; white-space: nowrap; }
  header input[type=password], header select { padding: 0.35rem 0.6rem; border-radius: 0.4rem; border: 1px solid var(--line-color, #d1d5db); background: var(--page-bg, #fff); color: var(--deep-text, #1f2328); width: 200px; font-size: 0.85rem; }
  header select { width: auto; cursor: pointer; }
  header button { padding: 0.4rem 1rem; border-radius: 0.4rem; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: opacity .2s; }
  header button:hover { opacity: .85; }
  .ghost { background: transparent; border: 1px solid var(--line-color, #d1d5db) !important; color: var(--deep-text, #333); }
  #status { font-size: 0.8rem; color: var(--meta-divider, #6b7280); margin-left: auto; white-space: nowrap; }
  nav.tabs { display: flex; gap: 0.25rem; padding: 0.5rem 1rem; background: var(--card-bg, #fff); border-bottom: 1px solid var(--line-color, #e5e7eb); overflow-x: auto; }
  nav.tabs button { padding: 0.45rem 1rem; border-radius: 0.5rem; border: 1px solid transparent; background: transparent; color: var(--meta-divider, #6b7280); cursor: pointer; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
  nav.tabs button.active { background: var(--selection-bg, #e0e7ff); color: var(--deep-text, #1f2328); }
  nav.tabs button:hover { color: var(--deep-text, #333); }
  .panel { flex: 1; min-height: 0; display: none; overflow-y: auto; }
  .panel.active { display: flex; flex-direction: column; }
  .layout { display: flex; flex: 1; min-height: 0; }
  aside { width: 280px; background: var(--card-bg, #fff); border-right: 1px solid var(--line-color, #e5e7eb); overflow-y: auto; padding: 0.5rem; flex-shrink: 0; }
  aside .post-item { padding: 0.5rem 0.6rem; border-radius: 0.4rem; cursor: pointer; margin-bottom: 0.25rem; }
  aside .post-item:hover { background: var(--btn-plain-bg-hover, #f1f5f9); }
  aside .post-item.active { background: var(--selection-bg, #e0e7ff); }
  aside .post-item .t { font-weight: 600; font-size: 0.85rem; }
  aside .post-item .s { font-size: 0.7rem; color: var(--meta-divider, #6b7280); }
  aside .empty { color: var(--meta-divider, #9ca3af); font-size: 0.8rem; text-align: center; padding: 2rem 0; }
  main.editor-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .fields { background: var(--card-bg, #fff); border-bottom: 1px solid var(--line-color, #e5e7eb); padding: 0.6rem 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .fields .full { grid-column: 1 / -1; }
  .fields input, .fields textarea { padding: 0.4rem 0.6rem; border: 1px solid var(--line-color, #d1d5db); border-radius: 0.4rem; font-size: 0.85rem; background: var(--page-bg, #fff); color: var(--deep-text, #1f2328); }
  .fields textarea { min-height: 3rem; resize: vertical; }
  .fields label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; }
  .toolbar { display: flex; gap: 0.5rem; padding: 0.5rem 1rem; background: var(--card-bg, #fff); border-bottom: 1px solid var(--line-color, #e5e7eb); flex-wrap: wrap; }
  .toolbar button { padding: 0.4rem 1rem; border-radius: 0.4rem; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  #btn-save { background: var(--primary, #3b82f6); color: #fff; }
  #btn-new { background: var(--primary, #3b82f6); opacity: .75; color: #fff; }
  #btn-delete { background: var(--fw-err, #ef4444); color: #fff; }
  #editor { flex: 1; min-height: 0; background: var(--card-bg, #fff); }
  #editor .cherry { height: 100%; }
  #editor .cherry .cherry-editor, #editor .cherry .cherry-previewer { height: 100%; }
  #editor .cherry { --fill-color: var(--card-bg); --text-color: var(--deep-text); --border-color: var(--line-color); --primary-color: var(--primary); }
  #editor .cherry .cherry-editor, #editor .cherry .cherry-previewer { background: var(--card-bg); color: var(--deep-text); }
  /* 列表型面板（评论/主题/系统） */
  .list-panel { padding: 1rem; max-width: 860px; width: 100%; margin: 0 auto; }
  .list-item { background: var(--card-bg, #fff); border: 1px solid var(--line-color, rgba(0,0,0,.08)); border-radius: var(--radius-large, 1rem); padding: 0.9rem 1.1rem; margin-bottom: 0.6rem; }
  .list-item .head { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .list-item .head .nm { font-weight: 700; }
  .list-item .head .tm { font-size: 0.75rem; color: var(--meta-divider, #6b7280); margin-left: auto; }
  .list-item .ct { margin-top: 0.4rem; font-size: 0.9rem; word-break: break-word; }
  .list-item .mk { font-size: 0.75rem; color: var(--meta-divider, #6b7280); margin-top: 0.3rem; }
  .list-item .act { margin-top: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn-mini { padding: 0.3rem 0.8rem; border-radius: 0.4rem; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
  .btn-danger { background: var(--fw-err, #ef4444); color: #fff; }
  .btn-primary { background: var(--primary, #3b82f6); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--line-color, #d1d5db); color: var(--deep-text, #333); }
  .empty-tip { text-align: center; color: var(--meta-divider, #9ca3af); padding: 2rem 0; font-size: 0.9rem; }
  .filter-bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; }
  .filter-bar input { padding: 0.4rem 0.6rem; border: 1px solid var(--line-color, #d1d5db); border-radius: 0.4rem; font-size: 0.85rem; background: var(--page-bg, #fff); color: var(--deep-text, #1f2328); width: 240px; }
  /* 密码面板 */
  .pwd-panel { max-width: 420px; width: 100%; margin: 2rem auto; padding: 0 1rem; }
  .pwd-panel h3 { margin-bottom: 1rem; }
  .pwd-panel input { width: 100%; padding: 0.5rem 0.7rem; margin-bottom: 0.6rem; border: 1px solid var(--line-color, #d1d5db); border-radius: 0.4rem; font-size: 0.9rem; background: var(--page-bg, #fff); color: var(--deep-text, #1f2328); }
  .pwd-panel button { padding: 0.5rem 1.4rem; border-radius: 0.4rem; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; background: var(--primary, #3b82f6); color: #fff; }
  #pwd-msg { margin-top: 0.6rem; font-size: 0.85rem; min-height: 1.2rem; color: var(--fw-err, #ef4444); }
  #pwd-msg.ok { color: var(--fw-ok, #22c55e); }
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; }
  .theme-card { background: var(--card-bg, #fff); border: 2px solid var(--line-color, rgba(0,0,0,.08)); border-radius: var(--radius-large, 1rem); padding: 1rem; cursor: pointer; transition: border-color .2s; }
  .theme-card:hover { border-color: var(--primary, #3b82f6); }
  .theme-card.active { border-color: var(--primary, #3b82f6); }
  .theme-card .nm { font-weight: 700; }
  .theme-card .ds { font-size: 0.8rem; color: var(--meta-divider, #6b7280); margin-top: 0.3rem; }
  .sys-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--line-color, rgba(0,0,0,.08)); font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <span class="brand">✍️ Fuwari Admin</span>
  <input id="token" type="password" placeholder="管理员密码（保存时必填）" autocomplete="off">
  <select id="theme-switch"></select>
  <select id="lang-switch">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <span id="status"></span>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="posts" class="active" data-i18n="tabPosts">📝 文章</button>
  <button data-tab="comments" data-i18n="tabComments">💬 评论</button>
  <button data-tab="themes" data-i18n="tabThemes">🎨 主题</button>
  <button data-tab="password" data-i18n="tabPassword">🔑 密码</button>
  <button data-tab="system" data-i18n="tabSystem">ℹ️ 系统</button>
</nav>

<!-- 文章 -->
<div class="panel active" id="panel-posts">
  <div class="layout">
    <aside id="post-list"></aside>
    <main class="editor-main">
      <div class="fields">
        <input id="f-title" class="full" data-i18n-ph="phTitle" placeholder="标题 *">
        <input id="f-category" data-i18n-ph="phCategory" placeholder="分类">
        <input id="f-tags" data-i18n-ph="phTags" placeholder="标签（逗号分隔）">
        <textarea id="f-description" class="full" data-i18n-ph="phDescription" placeholder="摘要描述"></textarea>
        <label class="full"><input type="checkbox" id="f-draft"> <span data-i18n="draftLabel">草稿（不对外发布）</span></label>
      </div>
      <div class="toolbar">
        <button id="btn-new" data-i18n="btnNew">＋ 新建</button>
        <button id="btn-save" data-i18n="btnSave">保存</button>
        <button id="btn-delete" data-i18n="btnDelete">删除</button>
      </div>
      <div id="editor"></div>
    </main>
  </div>
</div>

<!-- 评论 -->
<div class="panel" id="panel-comments">
  <div class="list-panel">
    <div class="filter-bar">
      <input id="cmt-slug" data-i18n-ph="phCommentFilter" placeholder="按文章 slug 过滤（留空=全部）">
      <button class="btn-primary btn-mini" id="cmt-load" data-i18n="btnLoad">加载</button>
    </div>
    <div id="cmt-list"></div>
  </div>
</div>

<!-- 主题 -->
<div class="panel" id="panel-themes">
  <div class="list-panel">
    <div class="theme-grid" id="theme-grid"></div>
  </div>
</div>

<!-- 密码 -->
<div class="panel" id="panel-password">
  <div class="pwd-panel">
    <h3 data-i18n="pwdTitle">🔑 修改管理员密码</h3>
    <input id="pwd-old" type="password" data-i18n-ph="pwdOld" placeholder="当前密码" autocomplete="current-password">
    <input id="pwd-new" type="password" data-i18n-ph="pwdNew" placeholder="新密码（至少 6 个字符）" autocomplete="new-password">
    <input id="pwd-new2" type="password" data-i18n-ph="pwdNew2" placeholder="确认新密码" autocomplete="new-password">
    <div id="pwd-msg"></div>
    <button id="pwd-ok" data-i18n="pwdSubmit">确认修改</button>
  </div>
</div>

<!-- 系统 -->
<div class="panel" id="panel-system">
  <div class="list-panel">
    <div id="sys-info"></div>
  </div>
</div>

<script src="/assets/cherry/cherry-markdown.core.js"></script>
<script>
(function () {
  'use strict';
  var API = (window.FUWARI_BASE || '/') + 'api';
  var currentSlug = null;
  var cherry = null;
  var cherryInit = false;
  var TOKEN_KEY = 'fuwari_admin_token';

  // ---------- i18n ----------
  var I18N = {
    zh: {
      tabPosts: '📝 文章', tabComments: '💬 评论', tabThemes: '🎨 主题', tabPassword: '🔑 密码', tabSystem: 'ℹ️ 系统',
      btnNew: '＋ 新建', btnSave: '保存', btnDelete: '删除', draftLabel: '草稿（不对外发布）',
      phTitle: '标题 *', phCategory: '分类', phTags: '标签（逗号分隔）', phDescription: '摘要描述', phCommentFilter: '按文章 slug 过滤（留空=全部）',
      btnLoad: '加载', pwdTitle: '🔑 修改管理员密码', pwdOld: '当前密码', pwdNew: '新密码（至少 6 个字符）', pwdNew2: '确认新密码', pwdSubmit: '确认修改',
      emptyPosts: '暂无文章，点击「＋ 新建」开始', emptyComments: '暂无评论', emptyThemes: '暂无主题', loadFail: '加载失败', saved: '已保存', deleted: '已删除',
      newMode: '新文章模式（保存后自动生成 slug）', needTitle: '请填写标题', needToken: '请先填写管理员密码', noSelection: '未选择文章',
      pwdEnter: '请输入当前密码', pwdShort: '新密码至少 6 个字符', pwdMismatch: '两次输入的新密码不一致', pwdOk: '✅ 密码已修改，请使用新密码', pwdFail: '修改失败', networkErr: '网络错误，请重试',
      uploadFail: '上传失败', ready: '就绪', systemTitle: '系统信息', themeSwitch: '切换主题', themeActive: '当前', langLabel: '语言'
    },
    en: {
      tabPosts: '📝 Posts', tabComments: '💬 Comments', tabThemes: '🎨 Themes', tabPassword: '🔑 Password', tabSystem: 'ℹ️ System',
      btnNew: '＋ New', btnSave: 'Save', btnDelete: 'Delete', draftLabel: 'Draft (not published)',
      phTitle: 'Title *', phCategory: 'Category', phTags: 'Tags (comma separated)', phDescription: 'Description', phCommentFilter: 'Filter by post slug (empty = all)',
      btnLoad: 'Load', pwdTitle: '🔑 Change Admin Password', pwdOld: 'Current password', pwdNew: 'New password (min 6 chars)', pwdNew2: 'Confirm new password', pwdSubmit: 'Change',
      emptyPosts: 'No posts yet — click "＋ New"', emptyComments: 'No comments', emptyThemes: 'No themes', loadFail: 'Load failed', saved: 'Saved', deleted: 'Deleted',
      newMode: 'New post mode (slug auto-generated on save)', needTitle: 'Please fill in the title', needToken: 'Please enter the admin password first', noSelection: 'No post selected',
      pwdEnter: 'Enter the current password', pwdShort: 'New password must be at least 6 characters', pwdMismatch: 'The two passwords do not match', pwdOk: '✅ Password updated, use the new one', pwdFail: 'Change failed', networkErr: 'Network error, please retry',
      uploadFail: 'Upload failed', ready: 'Ready', systemTitle: 'System Info', themeSwitch: 'Switch theme', themeActive: 'Active', langLabel: 'Language'
    }
  };
  var lang = localStorage.getItem('fuwari_lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
  function T(k) { return (I18N[lang] && I18N[lang][k]) || k; }
  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = T(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = T(el.dataset.i18nPh); });
    document.title = lang === 'zh' ? 'Fuwari 管理后台' : 'Fuwari Admin';
  }
  document.addEventListener('DOMContentLoaded', function () {
    el('lang-switch').value = lang;
    applyI18n();
  });

  function el(id) { return document.getElementById(id); }
  function getToken() {
    var t = el('token').value.trim();
    if (!t) t = localStorage.getItem(TOKEN_KEY) || '';
    return t;
  }
  function setStatus(msg, isErr) {
    var s = el('status');
    s.textContent = msg;
    s.style.color = isErr ? 'var(--fw-err,#ef4444)' : 'var(--meta-divider,#6b7280)';
  }
  function authHeaders(extra) {
    var h = { 'Content-Type': 'application/json', 'X-Admin-Token': getToken() };
    if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }
  function handleRes(res) {
    return res.json().then(function (json) {
      if (json && json.code === 0) return json.data;
      var err = new Error((json && json.message) || T('loadFail'));
      err.needToken = (json && (json.code === 2 || json.code === 3));
      throw err;
    });
  }

  // ---------- Tabs ----------
  function switchTab(name) {
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
    el('panel-' + name).classList.add('active');
    if (name === 'posts' && !cherryInit && window.Cherry) initCherry();
    if (name === 'comments') loadComments();
    if (name === 'themes') loadThemeGrid();
    if (name === 'system') loadSystemInfo();
  }

  // ---------- 主题切换 ----------
  function loadThemes() {
    var sel = el('theme-switch');
    fetch(API + '/themes')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.code !== 0) return;
        var list = json.data.list || [];
        sel.innerHTML = '';
        list.forEach(function (t) {
          var opt = document.createElement('option');
          opt.value = t.name;
          opt.textContent = t.name + (t.description ? ' - ' + t.description : '');
          if (t.active) opt.selected = true;
          sel.appendChild(opt);
        });
      })
      .catch(function () {});
  }
  function applyTheme(name) {
    fetch(API + '/theme', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ theme: name }),
    }).then(function () { location.reload(); }).catch(function () { location.reload(); });
  }
  function loadThemeGrid() {
    fetch(API + '/themes')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.code !== 0) return;
        var box = el('theme-grid');
        box.innerHTML = '';
        var list = json.data.list || [];
        if (!list.length) { box.innerHTML = '<div class="empty-tip">' + T('emptyThemes') + '</div>'; return; }
        list.forEach(function (t) {
          var card = document.createElement('div');
          card.className = 'theme-card' + (t.active ? ' active' : '');
          card.innerHTML =
            '<div class="nm">' + t.name + (t.active ? ' ✓' : '') + '</div>' +
            (t.description ? '<div class="ds">' + t.description + '</div>' : '') +
            (t.author ? '<div class="ds">by ' + t.author + '</div>' : '');
          card.onclick = function () {
            if (t.name === 'default' || confirm(T('themeSwitch') + ': ' + t.name + '?')) applyTheme(t.name);
          };
          box.appendChild(card);
        });
      })
      .catch(function () {});
  }

  // ---------- 文章 ----------
  function loadList() {
    fetch(API + '/posts?include_draft=1')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.code !== 0) return;
        var list = json.data.list || [];
        var box = el('post-list');
        box.innerHTML = '';
        if (!list.length) { box.innerHTML = '<div class="empty">' + T('emptyPosts') + '</div>'; return; }
        list.forEach(function (p) {
          var item = document.createElement('div');
          item.className = 'post-item' + (p.slug === currentSlug ? ' active' : '');
          item.innerHTML = '<div class="t">' + escapeHtml(p.title) + '</div>' +
            '<div class="s">' + escapeHtml(p.slug) + (p.draft ? ' · draft' : '') + '</div>';
          item.onclick = function () { openPost(p.slug); };
          box.appendChild(item);
        });
      })
      .catch(function () { setStatus(T('loadFail'), true); });
  }
  function openPost(slug) {
    fetch(API + '/posts/' + encodeURIComponent(slug))
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.code !== 0) return;
        var p = json.data;
        currentSlug = p.slug;
        el('f-title').value = p.title || '';
        el('f-category').value = p.category || '';
        el('f-tags').value = (p.tags || []).join(', ');
        el('f-description').value = p.description || '';
        el('f-draft').checked = !!p.draft;
        if (cherry) cherry.setValue(p.body || '');
        loadList();
        setStatus(T('saved') ? '' : '');
      })
      .catch(function () { setStatus(T('loadFail'), true); });
  }
  function resetForm() {
    el('f-title').value = ''; el('f-category').value = ''; el('f-tags').value = '';
    el('f-description').value = ''; el('f-draft').checked = false;
    if (cherry) cherry.setValue('');
  }
  function newPost() {
    currentSlug = null;
    resetForm();
    setStatus(T('newMode'));
    loadList();
  }
  function savePost() {
    var title = el('f-title').value.trim();
    if (!title) { setStatus(T('needTitle'), true); return; }
    var body = cherry ? cherry.getMarkdown() : '';
    var payload = {
      title: title,
      description: el('f-description').value.trim(),
      category: el('f-category').value.trim(),
      tags: el('f-tags').value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean),
      draft: el('f-draft').checked,
      body: body,
    };
    var url = API + '/posts';
    var method = 'POST';
    if (currentSlug) { url = API + '/posts/' + encodeURIComponent(currentSlug); method = 'PUT'; }
    fetch(url, { method: method, headers: authHeaders(), body: JSON.stringify(payload) })
      .then(handleRes)
      .then(function (data) {
        currentSlug = data.slug || currentSlug;
        setStatus(T('saved') + ': ' + currentSlug);
        loadList();
      })
      .catch(function (e) {
        if (e.needToken) setStatus(T('needToken'), true);
        else setStatus(e.message, true);
      });
  }
  function deletePost() {
    if (!currentSlug) { setStatus(T('noSelection'), true); return; }
    if (!confirm('Delete "' + currentSlug + '"?')) return;
    fetch(API + '/posts/' + encodeURIComponent(currentSlug), { method: 'DELETE', headers: authHeaders() })
      .then(handleRes)
      .then(function () {
        currentSlug = null;
        resetForm();
        setStatus(T('deleted'));
        loadList();
      })
      .catch(function (e) {
        if (e.needToken) setStatus(T('needToken'), true);
        else setStatus(e.message, true);
      });
  }
  function initCherry() {
    if (cherry) return;
    cherryInit = true;
    cherry = new Cherry({
      id: 'editor',
      value: '',
      editor: { defaultModel: 'edit&preview' },
      image: {
        accept: 'jpg|jpeg|png|gif|webp|avif',
        uploadHandler: function (files, callback) {
          if (!files || !files.length) { callback({}); return; }
          var fd = new FormData();
          fd.append('file', files[0]);
          fetch(API + '/admin/upload', { method: 'POST', headers: { 'X-Admin-Token': getToken() }, body: fd })
            .then(function (r) { return r.json(); })
            .then(function (json) {
              if (json.code === 0) { callback({ url: json.data.url }); }
              else { setStatus(T('uploadFail') + ': ' + json.message, true); callback({}); }
            })
            .catch(function () { setStatus(T('networkErr'), true); callback({}); });
        },
      },
      toolbars: { showToolbar: true },
    });
  }

  // ---------- 评论管理 ----------
  function loadComments() {
    var slug = el('cmt-slug').value.trim();
    var q = slug ? '?slug=' + encodeURIComponent(slug) : '';
    fetch(API + '/comments' + q)
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.code !== 0) return;
        var list = json.data.list || [];
        var box = el('cmt-list');
        box.innerHTML = '';
        if (!list.length) { box.innerHTML = '<div class="empty-tip">' + T('emptyComments') + '</div>'; return; }
        list.forEach(function (cm) {
          var item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML =
            '<div class="head"><span class="nm">' + escapeHtml(cm.nickname || '') + '</span>' +
            '<span class="tm">' + escapeHtml(cm.target_slug || '') + ' · ' + escapeHtml(cm.created_at || '') + '</span></div>' +
            '<div class="ct">' + escapeHtml(cm.content || '') + '</div>' +
            '<div class="act"><button class="btn-mini btn-danger" data-id="' + cm.id + '">' + (lang === 'zh' ? '删除' : 'Delete') + '</button></div>';
          item.querySelector('button').onclick = function () {
            if (!confirm('Delete comment #' + cm.id + '?')) return;
            fetch(API + '/comments/' + cm.id, { method: 'DELETE', headers: authHeaders() })
              .then(handleRes)
              .then(function () { loadComments(); })
              .catch(function (e) { setStatus(e.needToken ? T('needToken') : e.message, true); });
          };
          box.appendChild(item);
        });
      })
      .catch(function () { setStatus(T('loadFail'), true); });
  }

  // ---------- 密码 ----------
  function submitPwdChange() {
    var oldP = el('pwd-old').value.trim();
    var newP = el('pwd-new').value;
    var new2 = el('pwd-new2').value;
    var msg = el('pwd-msg');
    msg.classList.remove('ok');
    if (!oldP) { msg.textContent = T('pwdEnter'); return; }
    if (newP.length < 6) { msg.textContent = T('pwdShort'); return; }
    if (newP !== new2) { msg.textContent = T('pwdMismatch'); return; }
    fetch(API + '/admin/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': oldP },
      body: JSON.stringify({ old_password: oldP, new_password: newP }),
    })
      .then(handleRes)
      .then(function () {
        localStorage.setItem(TOKEN_KEY, newP);
        el('token').value = newP;
        msg.classList.add('ok');
        msg.textContent = T('pwdOk');
      })
      .catch(function (e) { msg.textContent = (e.message || T('pwdFail')) + (e.needToken ? '' : ''); });
  }

  // ---------- 系统 ----------
  function loadSystemInfo() {
    var box = el('sys-info');
    box.innerHTML = '<div class="empty-tip">' + T('systemTitle') + '…</div>';
    fetch(API + '/health')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        var d = json.data || {};
        box.innerHTML = '';
        var rows = [
          ['Version', d.version || ''],
          ['Host', d.hostname || ''],
          ['Uptime', d.uptime ? (d.uptime + 's') : ''],
          ['Posts Dir', d.posts_dir || ''],
          ['Themes', (d.themes && d.themes.join(', ')) || ''],
          ['Extensions', (d.extensions && d.extensions.join(', ')) || ''],
          ['Database', d.database || ''],
        ];
        rows.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'sys-row';
          row.innerHTML = '<span>' + escapeHtml(r[0]) + '</span><span>' + escapeHtml(String(r[1])) + '</span>';
          box.appendChild(row);
        });
      })
      .catch(function () { box.innerHTML = '<div class="empty-tip">' + T('loadFail') + '</div>'; });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---------- init ----------
  function init() {
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.addEventListener('click', function () { switchTab(b.dataset.tab); });
    });
    el('btn-save').addEventListener('click', savePost);
    el('btn-new').addEventListener('click', newPost);
    el('btn-delete').addEventListener('click', deletePost);
    el('pwd-ok').addEventListener('click', submitPwdChange);
    el('cmt-load').addEventListener('click', loadComments);
    el('theme-switch').addEventListener('change', function (e) { applyTheme(e.target.value); });
    el('lang-switch').addEventListener('change', function (e) {
      lang = e.target.value;
      localStorage.setItem('fuwari_lang', lang);
      applyI18n();
      switchTab(document.querySelector('#tabs button.active').dataset.tab);
    });
    el('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') savePost(); });
    var saved = localStorage.getItem(TOKEN_KEY);
    if (saved) el('token').value = saved;
    loadThemes();
    loadList();
    setStatus(T('ready'));
    // 默认进入文章页签；URL ?tab=xxx 可直达
    var want = new URLSearchParams(location.search).get('tab');
    if (want && document.querySelector('#tabs button[data-tab="' + want + '"]')) switchTab(want);
    else if (window.Cherry) initCherry();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
